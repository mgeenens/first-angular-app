<app-header/>

<main>
  <div id="dashboard">
    <app-dashboard-item
      [imgData]="{src: 'status.png', alt: 'A signal symbol'}"
      title="Server Status"
    >
      <app-server-status [currentStatus]="currentStatus"/>
    </app-dashboard-item>
    <app-dashboard-item
      [imgData]="{src: 'globe.png', alt: 'A globe'}"
      title="Traffic"
    >
      <app-traffic [dummyTrafficData]="dummyTrafficData" [maxTraffic]="maxTraffic"/>
    </app-dashboard-item>
    <app-dashboard-item
      [imgData]="{src: 'list.png', alt: 'A list of items'}"
      title="Support Tickets"
    >
      <app-tickets/>
    </app-dashboard-item>
  </div>

  <div id="rectangle">
    <div id="inputs">
      <p>
        <label>Width</label>
        <input type="number" step="1.0" [(ngModel)]="rectSize.width"/>
      </p>
      <p>
        <label>Height</label>
        <input type="number" step="1.0" [(ngModel)]="rectSize.height"/>
      </p>
    </div>
    <app-rect [(size)]="rectSize"/>
  </div>
</main>
